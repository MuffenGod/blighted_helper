plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.blighteddreams.helper'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

neoForge {
    version = '21.1.250'

    mods {
        blighted_helper {
            sourceSet sourceSets.main
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Compile against the pack's jars for GeckoLib animations, Curios slots, and BetterCombat / Relics integration
    compileOnly fileTree(dir: '../mods', includes: [
        'geckolib-neoforge-*.jar',
        'curios-neoforge-*.jar',
        'bettercombat-neoforge-*.jar',
        'relics-*.jar',
        'architectury-*.jar',
        'irons_spellbooks-*.jar',
        'hazentouvelib-*.jar',
        'champions-neoforge-*.jar'
    ])
}
